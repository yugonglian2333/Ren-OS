<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>书架 · Chrome DevTools 练习</title>
  <style>
    :root { color-scheme: light dark; --paper: #faf8f2; --ink: #282c29; --muted: #575e57; --rule: #c8cdc4; --accent: #365342; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1c221e; --ink: #efeee4; --muted: #bdc5bb; --rule: #545e54; --accent: #aeceaf; } }
    * { box-sizing: border-box; }
    body { background: var(--paper); color: var(--ink); margin: auto; max-width: 40rem; padding: clamp(1.25rem,5vw,3rem); font: 1rem/1.7 system-ui,sans-serif; }
    a { color: var(--accent); text-underline-offset: .2em; }
    h1 { font: 600 clamp(2.5rem,9vw,4rem)/1.1 Georgia,serif; margin: 2.75rem 0 .5rem; }
    h2 { font-size: 1.2rem; }
    p, details { color: var(--muted); }
    .filters { display:flex; flex-wrap:wrap; gap:.6rem; margin:1.5rem 0 .8rem; }
    button { background: transparent; font: inherit; padding:.45rem 1rem; border:1px solid var(--rule); color:var(--ink); border-radius:.3rem; cursor:pointer; }
    button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--paper); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    section { border-block:1px solid var(--rule); padding:.75rem 0; }
    ul { padding-inline-start:1.5rem; }
    li { margin:.5rem 0; }
    summary { cursor:pointer; padding:.8rem 0; }
  </style>
</head>
<body>
  <a href="/blog/chrome-devtools-debugging">← 回到 DevTools 教程</a>
  <main>
    <h1>我的书架</h1>
    <p>打开开发者工具，点「全部书目」，再点「只看在读」。两本读到一半的书去了哪里？</p>
    <div class="filters" role="group" aria-label="选择书目">
      <button type="button" id="all" aria-pressed="false">全部书目</button>
      <button type="button" id="reading" aria-pressed="false">只看在读</button>
    </div>
    <section aria-live="polite" aria-atomic="true">
      <h2 id="count">尚未加载</h2>
      <ul id="books"></ul>
    </section>
    <details>
      <summary>验证修复</summary>
      <label><input id="fixed" type="checkbox"> 使用修订版筛选函数</label>
      <p>勾选后再点「只看在读」，比较两次的响应和书架。</p>
    </details>
  </main>
  <script type="module" src="/labs/reading-shelf/shelf.js"></script>
</body>
</html>
